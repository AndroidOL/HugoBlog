baseURL: https://www.tianhao.me/
title: 牙刷刷的小站
copyright: 牙刷刷

theme: hugo-theme-stack

locale: zh-CN
defaultContentLanguage: zh-cn
timeZone: Asia/Shanghai

languages:
  zh-cn:
    label: 中文
    title: 牙刷刷的小站
    hasCJKLanguage: true
    params:
      sidebar:
        subtitle: 欢迎来到牙刷刷的小站
  en:
    label: English
    title: Toothbrush's Blog
    params:
      sidebar:
        subtitle: Welcome to Toothbrush's blog

services:
  googleAnalytics:
    id: G-3XEDP14XQG

pagination:
  pagerSize: 5


markup:
  goldmark:
    renderer:
      unsafe: false
  tableOfContents:
    endLevel: 4
    ordered: true
    startLevel: 2
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: true
    lineNumbersInTable: true
    tabWidth: 4

sass:
  transpiler:
    name: dartsass

params:
  mainSections:
    - posts
  featuredImageField: image
  rssFullContent: true
  favicon: /favicon.ico

  footer:
    since: 2023
    customText: <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">沪ICP备2025132005号-1</a> | 牙刷刷的小站

  dateFormat:
    published: "2006-01-02"
    lastUpdated: "2006-01-02 15:04"

  sidebar:
    emoji: "🍥"
    subtitle: 一个小小的博客，分享生活点滴
    avatar: img/avatar.png

  article:
    math: false
    toc: true
    readingTime: false
    license:
      enabled: true
      default: "Licensed under CC BY-NC-SA 4.0"

  comments:
    enabled: false

  defaultImage:
    opengraph:
      enabled: true
      local: false
      src: /img/avatar.png

  widgets:
    homepage:
      - type: search
        params:
          type: popup
      - type: archives
        params:
          limit: 5
      - type: tag-cloud
        params:
          limit: 10
    page:
      - type: toc

menu:
  main:
    - identifier: home
      name: 首页
      url: /
      weight: 10
      params:
        icon: home
    - identifier: posts
      name: 文章
      url: /posts/
      weight: 20
      params:
        icon: archives
    - identifier: categories
      name: 分类
      url: /categories/
      weight: 30
      params:
        icon: categories
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 40
      params:
        icon: tag
    - identifier: about
      name: 关于
      url: /about/
      weight: 50
      params:
        icon: user
  social:
    - identifier: github
      name: GitHub
      url: https://github.com/AndroidOL
      params:
        icon: brand-github
