baseURL: https://www.tianhao.me/
title: 牙刷刷的小站
copyright: 牙刷刷

theme: hugo-theme-stack

locale: zh-CN
defaultContentLanguage: zh-cn
timeZone: Asia/Shanghai

languages:
  zh-cn:
    label: 中文
    title: 牙刷刷的小站
    hasCJKLanguage: true
    params:
      sidebar:
        subtitle: 欢迎来到牙刷刷的小站
  en:
    label: English
    title: Toothbrush's Blog
    params:
      sidebar:
        subtitle: Welcome to Toothbrush's blog

services:
  googleAnalytics:
    id: G-3XEDP14XQG

pagination:
  pagerSize: 5


params:
  mainSections:
    - posts
  featuredImageField: image
  rssFullContent: true
  favicon: /favicon.ico

  footer:
    since: 2023
    customText: <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">沪ICP备2025132005号-1</a> | 牙刷刷的小站

  dateFormat:
    published: Jan 02, 2006
    lastUpdated: Jan 02, 2006 15:04 MST

  sidebar:
    emoji: "🍥"
    subtitle: 一个小小的博客，分享生活点滴
    avatar:
      enabled: true
      local: true
      src: img/avatar.png

  article:
    math: false
    toc: true
    readingTime: false
    license:
      enabled: true
      default: "Licensed under CC BY-NC-SA 4.0"

  comments:
    enabled: false

  defaultImage:
    opengraph:
      enabled: true
      local: false
      src: /img/avatar.png

menu:
  main: []
  social:
    - identifier: github
      name: GitHub
      url: https://github.com/AndroidOL
      params:
        icon: brand-github

markup:
  goldmark:
    renderer:
      unsafe: false
  tableOfContents:
    endLevel: 4
    ordered: true
    startLevel: 2
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: true
    lineNumbersInTable: true
    tabWidth: 4
